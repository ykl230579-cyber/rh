<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folha Salarial — GestãoRH</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/folha.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Folha <span>Salarial</span></h1>
        <p class="page-subtitle">Cálculo automático de salários, INSS (3%) e IRT progressivo.</p>
      </div>
      <div class="month-selector">
        <label class="form-label" style="margin:0">Mês de referência:</label>
        <select id="mes-ref" class="form-control" style="width:auto"></select>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-bottom:24px">
      <div class="kpi-card" style="--kpi-color:var(--primary)">
        <span class="kpi-icon">👥</span>
        <div class="kpi-value" id="kpi-func-folha">0</div>
        <div class="kpi-label">Funcionários</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--info)">
        <span class="kpi-icon">📊</span>
        <div class="kpi-value" id="kpi-bruto" style="font-size:1.1rem">—</div>
        <div class="kpi-label">Total Bruto</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--danger)">
        <span class="kpi-icon">📉</span>
        <div class="kpi-value" id="kpi-inss" style="font-size:1.1rem">—</div>
        <div class="kpi-label">Total INSS</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--warning)">
        <span class="kpi-icon">🏦</span>
        <div class="kpi-value" id="kpi-irt" style="font-size:1.1rem">—</div>
        <div class="kpi-label">Total IRT</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--success)">
        <span class="kpi-icon">💰</span>
        <div class="kpi-value" id="kpi-liq" style="font-size:1.1rem">—</div>
        <div class="kpi-label">Total Líquido</div>
      </div>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-container" style="border:none">
        <table class="table">
          <thead>
            <tr>
              <th>Funcionário</th>
              <th>Salário Base</th>
              <th>Subsídios</th>
              <th>Bruto</th>
              <th>INSS (3%)</th>
              <th>IRT</th>
              <th>Outros</th>
              <th>Líquido</th>
              <th style="text-align:right">Editar</th>
            </tr>
          </thead>
          <tbody id="folha-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal editar subsídios/descontos -->
  <div class="modal" id="folha-modal">
    <div class="modal-box modal-sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-f-nome">Editar Folha</span>
        <button class="modal-close" onclick="Folha.closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Salário Base</label>
          <p id="form-f-base" style="font-size:1rem;font-weight:700;color:var(--success);padding:8px 0"></p>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Subsídios (Kz)</label>
            <input type="number" id="form-f-sub" class="form-control" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="form-group">
            <label class="form-label">Outros Descontos (Kz)</label>
            <input type="number" id="form-f-outros" class="form-control" min="0" step="0.01" placeholder="0.00">
          </div>
        </div>
        <!-- Preview -->
        <div style="background:var(--bg-3);border-radius:var(--r-md);padding:14px 16px;margin-top:4px">
          <div class="salary-breakdown">
            <div class="line"><span>Bruto</span><span id="prev-bruto">—</span></div>
            <div class="line deduct"><span>INSS (3%)</span><span id="prev-inss">—</span></div>
            <div class="line deduct"><span>IRT</span><span id="prev-irt">—</span></div>
            <div class="line total"><span>💰 Líquido</span><span id="prev-liq">—</span></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Folha.closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="Folha.save()">💾 Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/folha.js"></script>
</body>
</html>
