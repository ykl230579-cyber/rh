<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desempenho — GestãoRH</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/desempenho.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Avaliação de <span>Desempenho</span></h1>
        <p class="page-subtitle">Registos de avaliação com notas, pontos fortes e áreas de melhoria.</p>
      </div>
      <button class="btn btn-primary" onclick="Desempenho.openNew()">＋ Nova Avaliação</button>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:24px">
      <div class="kpi-card" style="--kpi-color:var(--warning)">
        <span class="kpi-icon">⭐</span>
        <div class="kpi-value" id="kpi-avals">0</div>
        <div class="kpi-label">Avaliações</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--primary)">
        <span class="kpi-icon">👥</span>
        <div class="kpi-value" id="kpi-func-aval">0</div>
        <div class="kpi-label">Avaliados</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--warning)">
        <span class="kpi-icon">📊</span>
        <div class="kpi-value" id="kpi-avg-global">—</div>
        <div class="kpi-label">Média Global</div>
      </div>
    </div>

    <!-- Duas colunas: avaliações + ranking -->
    <div style="display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start">

      <!-- Avaliações -->
      <div>
        <div class="filters-bar">
          <input type="text" id="aval-search" class="form-control" placeholder="🔍  Buscar...">
          <select id="filter-func-aval" class="form-control"></select>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="table-container" style="border:none">
            <table class="table">
              <thead>
                <tr>
                  <th>Funcionário</th>
                  <th>Ciclo</th>
                  <th>Data</th>
                  <th>Nota</th>
                  <th>Pontos Fortes</th>
                  <th>A Melhorar</th>
                  <th>Comentários</th>
                  <th style="text-align:right">Ações</th>
                </tr>
              </thead>
              <tbody id="aval-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Ranking médias -->
      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
          <span class="card-title">🏆 Ranking por Média</span>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>Funcionário</th>
              <th style="text-align:center">Nº</th>
              <th>Média</th>
              <th>Stars</th>
            </tr>
          </thead>
          <tbody id="avg-tbody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="aval-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title" id="modal-aval-title">Nova Avaliação</span>
        <button class="modal-close" onclick="Desempenho.closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group form-full">
            <label class="form-label">Funcionário *</label>
            <select id="form-aval-func" class="form-control"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Ciclo *</label>
            <input type="text" id="form-aval-ciclo" class="form-control" placeholder="Ex: 2024 S1, Q3-2025">
          </div>
          <div class="form-group">
            <label class="form-label">Data *</label>
            <input type="date" id="form-aval-data" class="form-control">
          </div>
          <div class="form-group form-full">
            <label class="form-label">Nota (1 a 5) *</label>
            <select id="form-aval-nota" class="form-control">
              <option value="">Selecione...</option>
              <option value="1">1 — Insatisfatório</option>
              <option value="2">2 — Abaixo do Esperado</option>
              <option value="3">3 — Adequado</option>
              <option value="4">4 — Bom</option>
              <option value="5">5 — Excelente</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Pontos Fortes</label>
            <input type="text" id="form-aval-fortes" class="form-control" placeholder="Ex: Proatividade, trabalho em equipa">
          </div>
          <div class="form-group">
            <label class="form-label">Pontos a Melhorar</label>
            <input type="text" id="form-aval-melhorar" class="form-control" placeholder="Ex: Gestão do tempo">
          </div>
          <div class="form-group form-full">
            <label class="form-label">Comentários</label>
            <input type="text" id="form-aval-coment" class="form-control" placeholder="Observações adicionais...">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Desempenho.closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="Desempenho.save()">💾 Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/desempenho.js"></script>
</body>
</html>
