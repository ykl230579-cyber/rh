<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Férias — GestãoRH</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/ferias.css">
</head>
<body>
  <div class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Controlo de <span>Férias</span></h1>
        <p class="page-subtitle">Gestão de 22 dias anuais por funcionário, saldo e risco legal.</p>
      </div>
    </div>

    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-bottom:24px">
      <div class="kpi-card" style="--kpi-color:var(--primary)">
        <span class="kpi-icon">👥</span>
        <div class="kpi-value" id="kpi-f-total">0</div>
        <div class="kpi-label">Total</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--info)">
        <span class="kpi-icon">🏖</span>
        <div class="kpi-value" id="kpi-f-gozo">0</div>
        <div class="kpi-label">Em Gozo</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--success)">
        <span class="kpi-icon">✅</span>
        <div class="kpi-value" id="kpi-f-disponiveis">0</div>
        <div class="kpi-label">Com Saldo</div>
      </div>
      <div class="kpi-card" style="--kpi-color:var(--danger)">
        <span class="kpi-icon">⛔</span>
        <div class="kpi-value" id="kpi-f-esgotados">0</div>
        <div class="kpi-label">Esgotados</div>
      </div>
    </div>

    <div class="filters-bar">
      <input type="text" id="ferias-search" class="form-control" placeholder="🔍  Buscar funcionário...">
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-container" style="border:none">
        <table class="table">
          <thead>
            <tr>
              <th>Funcionário</th>
              <th style="text-align:center">Direito Anual</th>
              <th style="text-align:center">Gozados</th>
              <th>Saldo</th>
              <th>Status</th>
              <th>Risco Legal</th>
              <th>Período</th>
              <th style="text-align:right">Ações</th>
            </tr>
          </thead>
          <tbody id="ferias-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="ferias-modal">
    <div class="modal-box modal-sm">
      <div class="modal-header">
        <span class="modal-title" id="modal-fer-nome">Registar Férias</span>
        <button class="modal-close" onclick="Ferias.closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Dias Gozados</label>
            <input type="number" id="form-fer-gozados" class="form-control" min="0" max="22" step="1">
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select id="form-fer-status" class="form-control">
              <option value="Disponível">Disponível</option>
              <option value="Em Gozo">Em Gozo</option>
              <option value="Concluído">Concluído</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Data Início</label>
            <input type="date" id="form-fer-inicio" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Data Fim</label>
            <input type="date" id="form-fer-fim" class="form-control">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Ferias.closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="Ferias.save()">💾 Guardar</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/ferias.js"></script>
</body>
</html>
